name: check

# Validates the manifest and hooks module and runs hooks/register.test.ts on every pull request.
# bump-version calls this workflow and releases only if it passes, so a broken mod never ships.
# Neither command needs a signed-in Claude Code. There is no typecheck step: the engine writes
# .claude-plugin/types/ only for an interactive session, never under CI.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so the plugin API the tests run against changes only when this line does.
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - run: claude plugin validate .
      - run: claude plugin test .
