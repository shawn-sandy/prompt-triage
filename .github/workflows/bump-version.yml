name: bump-version

# Opens a pull request that bumps plugin.json when the mod's code changes on main:
# minor when a pushed commit subject starts with `feat:` or `feat(scope):`, patch otherwise.
# main requires a reviewed pull request, so the bump goes through one. release-version tags and
# publishes the release when that pull request merges.
# Installed users only get an update when `version` changes, so each merged change must bump it.
# The bump branch touches only plugin.json, which is outside `paths`, so it does not re-trigger.
# This file is in `paths` so a change to the release flow is exercised by its own merge.
on:
  push:
    branches: [main]
    paths:
      - hooks/register.ts
      - hooks/hooks.json
      - .github/workflows/bump-version.yml

permissions:
  contents: write

jobs:
  # Validate and test first; a failing check stops the bump pull request.
  check:
    uses: ./.github/workflows/check.yml

  bump:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write # pushes the bump branch
          permission-pull-requests: write # opens the bump pull request
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the subjects of every pushed commit are read below
          token: ${{ steps.app-token.outputs.token }}
      - name: Open the version bump pull request
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current=$(jq -r .version .claude-plugin/plugin.json)
          # Scan from the current version's release tag, so commits from runs that failed still count.
          since="prompt-triage--v$current"
          git rev-parse -q --verify "refs/tags/$since" >/dev/null || since="$BEFORE"
          if git log --format=%s "$since"..HEAD | grep -qE '^feat(\([^)]*\))?:'; then
            next=$(echo "$current" | awk -F. -v OFS=. '{ $2++; $3 = 0; print }')
          else
            next=$(echo "$current" | awk -F. -v OFS=. '{ $NF++; print }')
          fi
          branch="bump/v$next"
          git switch -c "$branch"
          sed -i -E "s/(\"version\": \")[^\"]+/\1$next/" .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $next"
          # The bump branch belongs to this workflow, so a rerun may replace an older push of it.
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "chore: bump version to $next" \
              --body "Bumps plugin.json to $next. Merging this pull request publishes the release."
          fi
          # Close older bump pull requests this one supersedes, so only one version bump stays open.
          gh pr list --state open --limit 100 --json number,headRefName \
            | jq -r --arg b "$branch" '.[] | select(.headRefName | startswith("bump/v")) | select(.headRefName != $b) | .number' \
            | while read -r number; do
              gh pr close "$number" --comment "Superseded by $branch."
            done
