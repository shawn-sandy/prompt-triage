name: bump-version

# Bumps plugin.json and publishes a tagged GitHub release when the mod's code changes on main:
# minor when a pushed commit subject starts with `feat:` or `feat(scope):`, patch otherwise.
# Installed users only get an update when `version` changes, so each merged change must bump it.
# The bump commit touches only plugin.json, which is outside `paths`, so it does not re-trigger.
# This file is in `paths` so a change to the release flow is exercised by its own merge.
on:
  push:
    branches: [main]
    paths:
      - hooks/register.ts
      - hooks/hooks.json
      - .github/workflows/bump-version.yml

permissions:
  contents: write

jobs:
  # Validate and test first; a failing check stops the bump and the release.
  check:
    uses: ./.github/workflows/check.yml

  bump:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # main requires PRs; this App is on the ruleset's bypass list so the bump commit can push.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the subjects of every pushed commit are read below
          token: ${{ steps.app-token.outputs.token }}
      - name: Bump version and release
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current=$(jq -r .version .claude-plugin/plugin.json)
          # Scan from the current version's release tag, so commits from runs that failed still count.
          since="prompt-triage--v$current"
          git rev-parse -q --verify "refs/tags/$since" >/dev/null || since="$BEFORE"
          if git log --format=%s "$since"..HEAD | grep -qE '^feat(\([^)]*\))?:'; then
            next=$(echo "$current" | awk -F. -v OFS=. '{ $2++; $3 = 0; print }')
          else
            next=$(echo "$current" | awk -F. -v OFS=. '{ $NF++; print }')
          fi
          sed -i -E "s/(\"version\": \")[^\"]+/\1$next/" .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $next"
          git push
          # gh creates the tag on the bump commit; a bare `git tag` + `--follow-tags` never pushed it.
          gh release create "prompt-triage--v$next" --target "$(git rev-parse HEAD)" \
            --title "prompt-triage v$next" --generate-notes
